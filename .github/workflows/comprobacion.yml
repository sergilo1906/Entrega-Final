name: Comprovació M13

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepara Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Instal·la les dependències fixades
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix functions ci
      - name: Comprova tipus i sintaxi
        run: npm run check
      - name: Compila les pàgines
        run: npm run build
      - name: Executa les proves unitàries
        run: npm run test:unit
      - name: Prepara Java 21 del runner
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Prepara Chromium
        run: node app/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Prova el servidor i els recorreguts d’escriptori i mòbil
        run: npm run test:emuladores
